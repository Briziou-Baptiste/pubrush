name: CI Pubrush Validation

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pubrush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- PHASE 1 : VALIDATION TESTS BACKEND & INVARIANTS MONOPOD ---
  run-backend-tests:
    name: Backend Tests & Deployment Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Installer les dépendances backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyyaml

      - name: Exécuter les tests avec pytest
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          PYTHONPATH: '.'
        run: |
          cd backend
          python -m pytest -v

      - name: Exécuter les tests unitaires des scripts de déploiement et de rollback
        run: |
          python3 -m unittest discover -s pubrush-k8s/monopod/tests -v

  # --- PHASE 2 : VALIDATION TYPESCRIPT MOBILE ---
  run-mobile-typecheck:
    name: Mobile TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances mobile
        run: |
          cd mobile
          npm ci --legacy-peer-deps --ignore-scripts

      - name: Valider les types TypeScript mobile
        run: |
          cd mobile
          test -f expo-env.d.ts || printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
          npx tsc --noEmit

  # --- PHASE 3 : VALIDATION TYPESCRIPT WEB ---
  run-web-typecheck:
    name: Web TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances web
        run: |
          cd web
          npm ci --ignore-scripts

      - name: Valider les types TypeScript web
        run: |
          cd web
          npx tsc --noEmit
