name: CI Pubrush Validation & Mobile Test Delivery

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pubrush-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- PHASE 1 : VALIDATION TESTS BACKEND & INVARIANTS MONOPOD ---
  run-backend-tests:
    name: Backend Tests & Deployment Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Installer les dépendances backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyyaml

      - name: Exécuter les tests avec pytest
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          PYTHONPATH: '.'
        run: |
          cd backend
          python -m pytest -v

      - name: Exécuter les tests unitaires des scripts de déploiement et de rollback
        run: |
          python3 -m unittest discover -s pubrush-k8s/monopod/tests -v

  # --- PHASE 2 : VALIDATION TYPESCRIPT MOBILE ---
  run-mobile-typecheck:
    name: Mobile TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances mobile
        run: |
          cd mobile
          npm ci --legacy-peer-deps --ignore-scripts

      - name: Valider les types TypeScript mobile
        run: |
          cd mobile
          test -f expo-env.d.ts || printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
          npx tsc --noEmit

  # --- PHASE 3 : VALIDATION TYPESCRIPT WEB ---
  run-web-typecheck:
    name: Web TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances web
        run: |
          cd web
          npm ci --ignore-scripts

      - name: Valider les types TypeScript web
        run: |
          cd web
          npx tsc --noEmit

  # --- PHASE 4 : PUBLICATION TEST EXPO GO (MOBILE PREVIEW) ---
  deploy-mobile-test:
    name: Expo Preview Test Publication
    runs-on: ubuntu-latest
    needs: [run-backend-tests, run-mobile-typecheck, run-web-typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Configurer EAS / Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Installer les dépendances mobile
        run: |
          cd mobile
          npm ci --legacy-peer-deps

      - name: Publier la mise à jour EAS Update (iOS & Android)
        env:
          EXPO_PUBLIC_API_URL: https://api.pubrush.com
          EXPO_PUBLIC_WEB_URL: https://pubrush.com/photo-capture
        run: |
          cd mobile
          echo "Publication EAS Update iOS..."
          eas update --branch preview --environment preview --message "Mise à jour automatique (iOS) - Build #${{ github.run_number }} (${{ github.sha }})" --platform ios --non-interactive
          echo "Publication EAS Update Android..."
          eas update --branch preview --environment preview --message "Mise à jour automatique (Android) - Build #${{ github.run_number }} (${{ github.sha }})" --platform android --non-interactive

      - name: Vérifier la publication EAS
        run: |
          cd mobile
          echo "=== État de la branche preview après publication ==="
          eas branch:view preview --non-interactive
