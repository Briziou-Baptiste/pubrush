apiVersion: apps/v1
kind: Deployment
metadata:
  name: pubrush-db
  namespace: default
spec:
  replicas: 1
  # CRITIQUE : Toujours Recreate pour un Deployment de BDD avec PVC RWO
  # pour éviter l'erreur Multi-Attach et la corruption de données.
  # (Privilégier postgres-statefulset.yaml pour une architecture Kubernetes standard)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pubrush-db
  template:
    metadata:
      labels:
        app: pubrush-db
    spec:
      securityContext:
        fsGroup: 70
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: pubrush-config
              key: DB_USER
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: pubrush-config
              key: DB_NAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pubrush-secrets
              key: DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data
        ports:
        - containerPort: 5432
          name: postgres
        startupProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: db-storage
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: default
spec:
  selector:
    app: pubrush-db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
