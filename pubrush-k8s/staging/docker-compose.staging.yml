name: pubrush-photo-staging

services:
  db-photo:
    image: postgres:15-alpine
    container_name: pubrush-photo-staging-db
    environment:
      POSTGRES_USER: photo_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-photo_staging_secret_pass}
      POSTGRES_DB: pubrush_photo_staging
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - photo_staging_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo_staging -d pubrush_photo_staging"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - photo_staging_net

  backend-photo:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: pubrush-backend:staging-photo
    container_name: pubrush-photo-staging-backend
    user: "10000:10001"
    env_file:
      - ../../backend/.env.staging
    environment:
      PORT: "8000"
      PYTHON_DOTENV_DISABLED: "1"
    ports:
      - "127.0.0.1:18000:8000"
    tmpfs:
      - /tmp:size=64M,uid=10000,gid=10001,mode=1777
    depends_on:
      db-photo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - photo_staging_net

volumes:
  photo_staging_db_data:

networks:
  photo_staging_net:
    driver: bridge
