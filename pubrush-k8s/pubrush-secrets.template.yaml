# ==============================================================================
# PUBRUSH - TEMPLATE DES SECRETS KUBERNETES
# ⚠️ NE JAMAIS COMMITER LE FICHIER CONTENANT LES VRAIES VALEURS DANS GIT !
# 
# Pour appliquer les secrets sur ton serveur K3s :
# 1. Copie ce fichier : cp pubrush-secrets.template.yaml pubrush-secrets.yaml
# 2. Remplis les vraies valeurs ci-dessous dans pubrush-secrets.yaml
# 3. Applique sur le cluster : kubectl apply -f pubrush-secrets.yaml
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: pubrush-secrets
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  SMTP_PASSWORD: "CHANGE_ME_SMTP_PASSWORD"
  SMTP_USER: "pubrush.app@gmail.com"
  JWT_SECRET_KEY: "CHANGE_ME_GENERATE_A_STRONG_RANDOM_SECRET_KEY_64_CHARS"
